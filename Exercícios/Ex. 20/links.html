    <title>Links</title>

            /*
            # = id
            . = class
            : = pseudo-class
            :: = pseudo-element
            > = children
            */

        body {
            font-family: Arial, Helvetica, sans-serif;
            background-color: rgb(43, 42, 42);
        }
        
        a {
            color: red;
            text-decoration: none;
            font-weight: bold;
        }

        a:visited {
            color: darkred;
        }

        a:hover {
            color: rgb(255, 255, 255);
            text-decoration: underline;
        }

        a:active {
             color: rgb(116, 116, 115);
        }

        h1 {
            color: red;
            text-align: center;
            
        }

        a.Especial::before {
            content: '☜';
        }

        a.Especial::after {
            content: '☞';
        }
    </style>
</head>
