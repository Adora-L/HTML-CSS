<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Teste com imagens</title>
</head>
<body>
    <h1>Testando carga de imagens</h1>
    <p>Você vai ver uma imagem que está na mesma pasta:</p>
    <img src="HTML5 200px.png" alt="Logo HTML5">
    <p>Podemos também carregar imagens que estão em outra pasta:</p>
    <img src="Imagens/CSS3 200px.jpg" alt="Logo CSS3">
    <p>Também podemos carregar imagens externas:</p>
    <img src="https://logospng.org/download/javascript/logo-javascript-icon-256.png" alt="Logo JavaScript">
</body>
</html>
