<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Modelo de caixas</title>
    <style>
        h1 {
            background-color: rgb(64, 248, 193);
            
            height: 300px;
            width: 300px;
            
            text-align: center;
            color: rgb(19, 51, 42);

            border-radius: 15px;
            border: 5px solid rgb(19, 51, 42);
            
            padding: 10px 10px 6px;
            
            margin: 20px auto 20px auto;
            /*Ordem: Top ( Auto ), Right ( Direita ), Bottom ( Baixo ) e Left ( Esquerda ).*/

            outline: 2px dashed black;
        }

        a {
            border-width: 2px;
            border-style: dashed;
            border-color: gray;
            text-decoration: none;
            color: red;
        }

        a:hover {
            color: blue;
            text-decoration: underline;
        }

    </style>
</head>
<body>
    <h1>Exemplos de caixas box-level</h1>
    <p>Parágrafos também são exemplos de box-level, mas os <a href="a">links são exemplos de caixas inline-level</a>. Vamos ver como tudo isso funciona.</p>
</body>
</html>
