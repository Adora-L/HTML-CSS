<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mídias em HTML5</title>
</head>
<body>
    <h1>Imagem dinâmica</h1>
    <p>Tente abrir esse site em vários dispositivos diferentes ou simplesmente aumente e diminua o tamanho do seu navegador.</p>

    <picture>
        <source media="(max-width: 750px)" srcset="Imagens/Imagem-P.png" type="image/png">
        <source media="(max-width: 1000px)" srcset="Imagens/Imagem-M.png" type="image/png">
        <img src="Imagens/Imagem-G.png" alt="Imagem flexível">
    </picture>
    <h1>Reproduzindo áudio</h1>
    <p>Vamos aprender a reproduzir áudios em HTMLs.</p>
    <h2>Música: Butterfly - Patrick Patrikios</h2>
    <audio preload="metadata" autoplay controls loop>
        <source src="Mídia/Butterfly-Patrick-Patrikios.mp3" type="audio/mpeg">
    </audio>

</body>
</html>
