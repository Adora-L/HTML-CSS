<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulário</title>
</head>
<body>
    <h1>Exemplo de formulário</h1>
    <form action="cadastro.html" method="get" autocomplete="on">
        <p>
            <label for="Num">Número:</label>
            <input type="range" name="Número" id="Num" min="0" max="10" value="1" oninput="numvalue.innerHTML = Number(Num.value)">
            <output id="numvalue" name="Valor do número">1</output>
        </p>

        <p>
            <input type="submit" value="Enviar">
            <input type="reset" value="Limpar">
        </p>
    </form>
</body>
</html>
