<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>formulário</title>
</head>
<body>
    <h1>Teste de formulário</h1>
    <form action="cadastro.html" method="get" autocomplete="on">
        <p>
            <label for="Name">Nome</label>
            <input type="text" id="Name" Name="Nome" required maxlength="15" autocomplete="name">
        </p>
        <p>
            <label for="Number">Média</label>
        <input type="number" name="Media" id="Number" min="0" max="10" step="0.5" required value="0">
        </p>
        <p>
            <label for="Month">Período Letivo</label>
            <input type="month" id="Month" name="Período" required value="2026-05">
        </p>
        <p>
            <label for="Time">Hora</label>
            <input type="time" value="00:00" id="Time" name="Hora" required>
        </p>
        <p>
            <input type="submit" value="Enviar">
            <input type="reset" value="Limpar">
        </p>
    </form>
</body>
</html>
