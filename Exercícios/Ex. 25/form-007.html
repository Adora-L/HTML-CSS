<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulário</title>
</head>
<body>
    <h1>Exemplo de formulário</h1>
    <fieldset>
        <legend>Tags legais</legend>
        <form action="cadastro.html" method="get" autocomplete="on">
            <p>
                <label for="State">Estado</label>
                <select name="Estado" id="State">
                    <optgroup label="Região Sudeste">
                        <option value="MG">Minas Gerais</option>
                        <option value="RJ">Rio de Janeiro</option>
                    </optgroup>
                    <optgroup label="Região Nordeste">
                        <option value="CE">Ceará</option>
                        <option value="BA">Bahia</option>
                    </optgroup>
                </select>
            </p>
            <p>
                <label for="Profition">Profissão:</label>
                <input type="text" name="Profissão" id="Profition" list="list-profition">
                <datalist id="list-profition">
                    <option value="ADM">Administrador</option>
                    <option value="DEV">Desenvolvedor</option>
                </datalist>
            </p>
            <p>
                <label for="Messenger">Mensagem:</label><br>
                <textarea name="Mensagem" id="Messenger" cols="30" rows="10"></textarea>
            </p>
            <p>
            <input type="submit" value="Enviar">
            <input type="reset" value="Limpar">
        </p>
        </form>
    </fieldset>
</body>
</html>
