<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulário</title>
</head>
<body>
    <h1>Teste de formulário</h1>
    <form action="cadastro.html" method="get" autocomplete="on">
        <p>
            <label for="Year">Em que ano você nasceu?</label>
            <input type="number" name="Ano" id="Year" min="1900" max="2026" value="2000" oninput="calcage()">
        </p>

        <p>
            <label for="Age">Sua idade é:</label>
            <output id="Age">0</output>
        </p>

        <p>
            <input type="submit" value="Enviar">
            <input type="reset" value="Limpar">
        </p>
    </form>

    <script>
        function calcage() {
            let actually = new Date().getFullYear()
            Age.innerHTML = Number(actually) - Number(Year.value)
        }
    </script>
</body>
</html>
